[project]
name = "lemmatization-lesson"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kirill Soloshenko", email = "k.soloshenko1@mts.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "conllu>=6.0.0",
    "datasets>=5.2.0",
    "jiwer>=4.0.0",
    "protobuf>=7.36.2",
    "requests>=2.34.2",
    "sentencepiece>=0.2.3",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
lemmatization-lesson = "lemmatization_lesson:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
